name: Orbita Flash - APK de prueba

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbita-Flash-Proyecto.zip'
      - '.github/workflows/orbita-flash.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android sin el paquete antiguo tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: python3 -m zipfile -e Orbita-Flash-Proyecto.zip proyecto

      - name: Compilar APK de prueba
        working-directory: proyecto
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar descarga
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk Orbita-Flash-PRUEBA.apk

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Orbita-Flash-APK-PRUEBA
          path: Orbita-Flash-PRUEBA.apk
          if-no-files-found: error

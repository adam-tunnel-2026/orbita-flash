name: Orbita Flash - APK de prueba

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbita-Flash-Proyecto.zip'
      - '.github/workflows/orbita-flash.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
